spring.application.name=records-service
server.port=${SERVER_PORT:0}
spring.datasource.url=${RECORDS_DB_URL}
spring.datasource.username=${RECORDS_DB_USER}
spring.datasource.password=${RECORDS_DB_PASSWORD}
spring.flyway.url=${RECORDS_DB_URL}
spring.flyway.user=${RECORDS_MIGRATION_USER}
spring.flyway.password=${RECORDS_MIGRATION_PASSWORD}
spring.flyway.default-schema=records
spring.flyway.schemas=records
spring.flyway.create-schemas=false
spring.flyway.placeholders.recordsRuntimeRole=${RECORDS_DB_USER}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=records
spring.sql.init.mode=never
records.storage-root=${RECORDS_STORAGE_ROOT}
