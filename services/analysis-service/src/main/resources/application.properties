spring.application.name=analysis-service
server.port=${SERVER_PORT:0}
spring.datasource.url=${ANALYSIS_DB_URL}
spring.datasource.username=${ANALYSIS_DB_USER}
spring.datasource.password=${ANALYSIS_DB_PASSWORD}
spring.flyway.url=${ANALYSIS_DB_URL}
spring.flyway.user=${ANALYSIS_MIGRATION_USER}
spring.flyway.password=${ANALYSIS_MIGRATION_PASSWORD}
spring.flyway.default-schema=analysis
spring.flyway.schemas=analysis
spring.flyway.create-schemas=false
spring.flyway.placeholders.analysisRuntimeRole=${ANALYSIS_DB_USER}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=analysis
spring.sql.init.mode=never
analysis.storage-root=${ANALYSIS_STORAGE_ROOT}
analysis.operations.worker-enabled=${ANALYSIS_WORKER_ENABLED:false}
analysis.model.base-url=${ANALYSIS_MODEL_BASE_URL:}
analysis.model.path=${ANALYSIS_MODEL_PATH:}
analysis.model.sha256=${ANALYSIS_MODEL_SHA256:}
analysis.model.runtime-build=${ANALYSIS_MODEL_RUNTIME_BUILD:}
analysis.model.token=${ANALYSIS_MODEL_TOKEN:}
analysis.model.timeout-seconds=${ANALYSIS_MODEL_TIMEOUT_SECONDS:}
analysis.model.output-tokens=${ANALYSIS_MODEL_OUTPUT_TOKENS:8192}
analysis.model.seed=${ANALYSIS_MODEL_SEED:1}
analysis.model.temperature=${ANALYSIS_MODEL_TEMPERATURE:0.7}
analysis.model.top-p=${ANALYSIS_MODEL_TOP_P:0.8}
analysis.model.top-k=${ANALYSIS_MODEL_TOP_K:20}
analysis.model.min-p=${ANALYSIS_MODEL_MIN_P:0}
analysis.model.presence-penalty=${ANALYSIS_MODEL_PRESENCE_PENALTY:1.5}
analysis.model.repeat-penalty=${ANALYSIS_MODEL_REPEAT_PENALTY:1.0}
analysis.records.base-url=${ANALYSIS_RECORDS_BASE_URL:}
analysis.records.user=${ANALYSIS_RECORDS_USER:}
analysis.records.password=${ANALYSIS_RECORDS_PASSWORD:}
analysis.records.timeout-seconds=${ANALYSIS_RECORDS_TIMEOUT_SECONDS:}
