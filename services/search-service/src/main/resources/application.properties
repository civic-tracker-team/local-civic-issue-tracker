spring.application.name=search-service
server.port=${SERVER_PORT:0}
spring.datasource.url=${SEARCH_DB_URL}
spring.datasource.username=${SEARCH_DB_USER}
spring.datasource.password=${SEARCH_DB_PASSWORD}
spring.flyway.url=${SEARCH_DB_URL}
spring.flyway.user=${SEARCH_MIGRATION_USER}
spring.flyway.password=${SEARCH_MIGRATION_PASSWORD}
spring.flyway.default-schema=search
spring.flyway.schemas=search
spring.flyway.create-schemas=false
spring.flyway.placeholders.searchRuntimeRole=${SEARCH_DB_USER}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=search
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.sql.init.mode=never
search.indexer.enabled=${SEARCH_INDEXER_ENABLED:false}
search.indexer.delay=${SEARCH_INDEXER_DELAY:PT30S}
search.indexer.initial-delay=${SEARCH_INDEXER_INITIAL_DELAY:PT0S}
search.owners.timeout=${SEARCH_OWNER_TIMEOUT:PT30S}
search.owners.coordinator.base-url=${SEARCH_COORDINATOR_BASE_URL:}
search.owners.coordinator.user=${SEARCH_COORDINATOR_USER:}
search.owners.coordinator.password=${SEARCH_COORDINATOR_PASSWORD:}
search.owners.records.base-url=${SEARCH_RECORDS_BASE_URL:}
search.owners.records.user=${SEARCH_RECORDS_USER:}
search.owners.records.password=${SEARCH_RECORDS_PASSWORD:}
search.owners.analysis.base-url=${SEARCH_ANALYSIS_BASE_URL:}
search.owners.analysis.user=${SEARCH_ANALYSIS_USER:}
search.owners.analysis.password=${SEARCH_ANALYSIS_PASSWORD:}
