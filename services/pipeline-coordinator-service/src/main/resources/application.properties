spring.application.name=pipeline-coordinator-service
server.port=${SERVER_PORT:0}
spring.datasource.url=${COORDINATOR_DB_URL}
spring.datasource.username=${COORDINATOR_DB_USER}
spring.datasource.password=${COORDINATOR_DB_PASSWORD}
spring.flyway.url=${COORDINATOR_DB_URL}
spring.flyway.user=${COORDINATOR_MIGRATION_USER}
spring.flyway.password=${COORDINATOR_MIGRATION_PASSWORD}
spring.flyway.default-schema=coordinator
spring.flyway.schemas=coordinator
spring.flyway.create-schemas=false
spring.flyway.placeholders.coordinatorRuntimeRole=${COORDINATOR_DB_USER}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=coordinator
spring.sql.init.mode=never
coordinator.driver.enabled=${COORDINATOR_DRIVER_ENABLED:false}
coordinator.max-meetings=${COORDINATOR_MAX_MEETINGS}
coordinator.preparation-profile-id=${COORDINATOR_PREPARATION_PROFILE_ID:}
coordinator.stall-after=${COORDINATOR_STALL_AFTER:}
coordinator.publish.automatic=${COORDINATOR_PUBLISH_AUTOMATIC:false}
coordinator.records.base-url=${COORDINATOR_RECORDS_BASE_URL:}
coordinator.records.username=${COORDINATOR_RECORDS_USERNAME:}
coordinator.records.password=${COORDINATOR_RECORDS_PASSWORD:}
coordinator.records.timeout-seconds=${COORDINATOR_RECORDS_TIMEOUT_SECONDS:}
coordinator.analysis.base-url=${COORDINATOR_ANALYSIS_BASE_URL:}
coordinator.analysis.username=${COORDINATOR_ANALYSIS_USERNAME:}
coordinator.analysis.password=${COORDINATOR_ANALYSIS_PASSWORD:}
coordinator.analysis.timeout-seconds=${COORDINATOR_ANALYSIS_TIMEOUT_SECONDS:}
